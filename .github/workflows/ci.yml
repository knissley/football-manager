# CI — the checks that gate a merge, run on both architectures the sim promises to
# agree on.
#
# ## Required checks
#
# Branch protection on `main` should require exactly these two checks (Settings →
# Branches → "Require status checks to pass"). Only the repo owner can set that; an
# agent cannot.
#
#     test (ubuntu-24.04)
#     test (ubuntu-24.04-arm)
#
# The two `harness (...)` jobs are REPORTING, not gating, and must not be added to the
# required list. Calibration rows print with an `ok`/`OFF` mark (or `stale`/`unsourced`
# for a row whose band cannot be trusted for the run); an `OFF` row does not fail the job
# today. Flipping a row to gating is a later, per-row decision made in a
# retune issue, not here.
#
# ## Why two architectures
#
# Determinism is the guarantee the project calls the most expensive to break: a stored
# game is the tuple `(initialState, seed, sliderConfig, decisionLog)` and is re-simulated
# on demand, so drift corrupts saved history rather than merely failing a test
# (ADR-0003). Floating-point results can differ between arm64 and x86_64, so the golden
# tests — `GoldenWorldTests` in FMGeneration, `GoldenSeedTests` in FMSimulation — run on
# both, and a one-digit change to either constant turns both legs red.
#
# `ubuntu-24.04-arm` is a GitHub-hosted runner, free while this repository is public. If
# it ever goes private, the arm leg needs a paid plan or a self-hosted arm64 runner —
# swap the label rather than deleting the leg.
#
# ## Why a container rather than a toolchain install
#
# `swift:6.2` is the official image and is published for both linux/amd64 and
# linux/arm64, so both legs compile with the same toolchain build and neither leg spends
# two minutes downloading a tarball. If a pull ever fails on the arm leg, do not drop
# arm64 — drop `container:` for that leg instead and install the toolchain on the runner:
# either `swift-actions/setup-swift@v2`, or `./scripts/install-swift.sh`, which picks the
# right tarball for the machine's architecture.
#
# ## Cost note
#
# `push` is deliberately unfiltered, so a branch is checked before a PR exists. While a
# PR is open its branch is therefore built twice per push (once for `push`, once for
# `pull_request`). That is the price of getting a signal on a bare branch; narrow the
# `push` trigger to `main` if the minutes ever start to matter.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # Without this the runner picks `sh -e {0}` for steps inside the container, and dash
    # has no `pipefail` — the first step that asked for it died with "Illegal option -o
    # pipefail". `bash` here means `bash --noprofile --norc -eo pipefail`, so no step
    # needs to set either flag itself.
    shell: bash

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - name: Trust the workspace
        # The job runs as root inside the container; without this git calls from the
        # checkout action and from SwiftPM can trip "dubious ownership".
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          # SwiftPM keeps each package's artifacts under its own .build; there is no
          # shared derived-data directory to cache.
          path: |
            Packages/*/.build
            Tools/*/.build
          # Every pattern is depth-fixed, never `**`. The post step re-evaluates this key
          # on the host after the container has written .build as root, and a `**` glob
          # walks into those root-owned directories and fails the whole job with "Fail to
          # hash files under directory". Nothing here descends past a package directory.
          # No Package.resolved exists yet — the FM* packages have no external
          # dependencies, and hashFiles is content with a pattern that matches nothing —
          # but it is in the key so the day one lands, the cache turns over.
          key: spm-test-swift6.2-${{ runner.arch }}-${{ hashFiles('Packages/*/Package.swift', 'Tools/*/Package.swift', 'Packages/*/Package.resolved', 'Tools/*/Package.resolved') }}
          restore-keys: |
            spm-test-swift6.2-${{ runner.arch }}-

      - name: Format
        # `swift format lint` exits 0 even when it reports findings; --strict is what
        # makes them errors, and without it this step could never fail.
        run: swift format lint --strict --recursive --parallel Packages/ Tools/

      - name: Banned primitives in the sim
        # The determinism and purity lint from issue #8: banned primitives in the FM*
        # Sources trees, framework imports, and Hasher in a golden. See docs/tools.md.
        run: ./scripts/lint-sim.sh

      - name: Sim lint self-test
        # The lint strips comments before matching, and that stripper is the part of it
        # most likely to be quietly wrong. This lints scripts/lint-sim-fixtures/ — a
        # Swift file per rule, never compiled and never scanned by the step above — and
        # fails on any difference from the expected hit list (issue #53).
        run: ./scripts/lint-sim.sh --self-test

      - name: Reference lint self-test
        # Rule 8 (never copy rulebook text) and rule 10 (a football claim carries an
        # article number) had nothing enforcing them until #98. The lint needs the
        # rulebook, which is not in the repository and will not be, so the step below
        # skips here — this one does not: the fixture tree ships an invented corpus, so
        # the scanner, its joining of wrapped lines, its baseline and the citation index
        # are all exercised on every run. See docs/tools.md.
        run: ./scripts/lint-reference.sh --self-test

      - name: Reference lint
        # Expected to print SKIPPED and pass: no corpus is available to the runner. It is
        # here so the skip path is exercised rather than assumed, and so the day a corpus
        # can be made available this step starts checking instead of having to be added.
        run: ./scripts/lint-reference.sh

      - name: Test census
        # Rule 11: every test says what kind it is. This fails on a @Test with no kind
        # tag, and writes the shares into the job summary so they are in front of
        # whoever opens the run rather than in a script nobody remembers to call (#43).
        # See docs/testing.md. The census reads source, not behaviour, so both legs
        # print the same table; that is the cost of not giving it a job of its own.
        run: |
          census="${RUNNER_TEMP:-/tmp}/test-census.txt"
          # The exit code is what gates, and it is captured rather than allowed to end
          # the step, so the table reaches the summary on a failing run too — which is
          # the run where somebody wants to read it.
          status=0
          ./scripts/test-census.sh > "$census" 2>&1 || status=$?
          cat "$census"
          {
            echo "## Test census — ${{ matrix.runner }}"
            echo
            echo "Every \`@Test\` carries one kind tag — \`.football\`, \`.contract\`,"
            echo "\`.unit\` or \`.pin\`. A test with none fails this step. What the shares"
            echo "mean is in \`docs/testing.md\`."
            echo
            echo '```text'
            cat "$census"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Test census self-test
        # The scan is the subtle part — a multi-line attribute, a parameterised test, a
        # @Test written inside a comment or a string. This censuses
        # scripts/test-census-fixtures/, never compiled and never part of a package, and
        # fails on any difference from the expected list.
        run: ./scripts/test-census.sh --self-test

      - name: Calibration sources self-test
        # Every sourced band in `Targets.swift` is a ratio of the component sums
        # `scripts/calibration-sources.py` folds, and that fold got a signed component
        # wrong for as long as it was written with a counting accumulator — silently, by
        # dropping the key rather than raising. This runs the accumulator's own cases,
        # which need no play-by-play release and so run on every push. The derivation
        # itself cannot run here: the data set is about 20 MB a season and is not, and
        # will not be, in the repository. See docs/reference/calibration-sources.md.
        run: python3 scripts/calibration-sources.py --self-test

      - name: FMRandom
        run: swift test --package-path Packages/FMRandom

      - name: FMRandom (release)
        # The RNG's integer maths must give the same answers with optimisation on.
        run: swift test -c release --package-path Packages/FMRandom

      - name: FMCore
        run: swift test --package-path Packages/FMCore

      - name: FMGeneration
        run: swift test --package-path Packages/FMGeneration

      - name: FMSimulation
        run: swift test --package-path Packages/FMSimulation

      - name: simharness
        # The harness is a tool, but its tests guard two things nothing else does: that
        # the calibration table in docs/match-engine.md is the one Targets.swift
        # generates, and the shape of the Budget block the summary step below parses.
        # Without this step neither runs in CI at all.
        run: swift test --package-path Tools/simharness

      - name: gamelog
        # Nothing else compiles this tool, and its suite asserts what a drive summary says
        # about the clock — which is the half of a game an aggregate cannot show at all.
        run: swift test --package-path Tools/gamelog

      - name: Harness determinism
        # The harness's output at a seed is byte-identical between two runs of the same
        # binary, and every before-and-after comparison in the backlog rests on it (#52).
        # Until this step existed that property was checked by hand, twice per seed, by
        # whoever remembered; now a line that moves between two runs fails the build here
        # instead of being read as noise in a review (#72). --no-timing drops the Budget
        # block, which is the one part of the output that is meant to move.
        run: |
          swift build --package-path Tools/simharness
          first="${RUNNER_TEMP:-/tmp}/harness-determinism-1.txt"
          second="${RUNNER_TEMP:-/tmp}/harness-determinism-2.txt"
          for out in "$first" "$second"; do
            swift run --skip-build --package-path Tools/simharness \
              simharness --games 50 --no-timing --seed 7 > "$out"
          done
          if ! cmp -s "$first" "$second"; then
            echo "::error::simharness printed two different runs at seed 7 — the harness"
            echo "::error::reads something that is not the seed, and every before-and-after"
            echo "::error::comparison in the backlog is worthless until it does not."
            # `|| true` because diff exits 1 on a difference and the step's shell runs
            # with `-eo pipefail`, which would end the step before the exit below.
            diff "$first" "$second" | head -40 || true
            exit 1
          fi
          echo "Two 50-game runs at seed 7 are identical:"
          grep 'world checksum' "$first"

      - name: playsize
        # Also the proof that the FM* modules link standalone, outside a test bundle.
        run: swift run --package-path Tools/playsize

      - name: worldgen
        # Nothing else compiles this tool, so without this step it can rot unnoticed.
        run: swift build --package-path Tools/worldgen

  harness:
    # Reporting only — see the header. Do not make this a required check.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: Tools/simharness/.build
          # Depth-fixed patterns only — see the note on the same key in `test`.
          key: spm-harness-swift6.2-${{ runner.arch }}-${{ hashFiles('Packages/*/Package.swift', 'Tools/*/Package.swift', 'Packages/*/Package.resolved', 'Tools/*/Package.resolved') }}
          restore-keys: |
            spm-harness-swift6.2-${{ runner.arch }}-

      - name: Build
        run: swift build -c release --package-path Tools/simharness

      - name: Run 400 games at seed 7
        # --skip-build keeps SwiftPM's progress lines out of the captured output, so the
        # artifact and the summary table are the harness's own words and nothing else.
        run: |
          swift run -c release --skip-build --package-path Tools/simharness \
            simharness --games 400 --seed 7 > harness-seed7.txt
          cat harness-seed7.txt

      - name: Upload the full output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simharness-seed7-${{ matrix.runner }}
          path: harness-seed7.txt
          if-no-files-found: error

      - name: Calibration table and budget
        if: always()
        run: |
          if [ ! -s harness-seed7.txt ]; then
            echo "The harness produced no output — see the failing step above." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Every row that carries a target band, whichever section it sits in. Fields
          # are runs of two-or-more spaces; a target row is label, value, band, verdict,
          # season, source key and (optionally) the rule areas it is sensitive to, in
          # that order — the shape `report` in Tools/simharness/Sources/simharness/main.swift
          # prints. A section header is an indented line with no digits and one field.
          rows="$(awk '
            BEGIN { FS = "  +"; section = "per team per game" }
            {
              if ($0 ~ /^  [^ ]/ && NF == 2 && $2 !~ /[0-9]/) { section = $2; next }
              if ($2 ~ /^metric \(/) { section = "per team per game"; next }
              if (NF < 6) next
              label = $2; value = $3; band = $4; mark = $5; season = $6
              src = (NF >= 7) ? $7 : ""
              sensitive = (NF >= 8) ? $8 : ""
              if (band !~ /^[0-9]+(\.[0-9]+)?-[0-9]+(\.[0-9]+)?$/ && band != "none") next
              if (mark !~ /^(ok|OFF|\(ok\)|\(OFF\)|stale|unsourced|n\/a)$/) next
              printf "| %s | %s | %s | %s | %s | %s | %s | %s |\n", section, label, value, band, mark, season, src, sensitive
            }
          ' harness-seed7.txt)"
          # The Budget block is everything from its header to the end of the run — the
          # harness prints it last precisely so this can be a tail (#9). It carries no
          # band and no verdict, so the parser above skips its lines and it is reported
          # here on its own.
          budget="$(awk '$0 == "  Budget" { inBlock = 1 } inBlock' harness-seed7.txt)"
          {
            echo "## simharness — 400 games, seed 7 — ${{ matrix.runner }}"
            echo
            echo "Reporting only: an \`OFF\` row does not fail this job. A \`stale\` row was"
            echo "sourced under a different rulebook than the run; an \`unsourced\` row has a"
            echo "band nobody has cited; neither is ever \`ok\`. The source keys are listed"
            echo "under Sources in the full output."
            echo
            if [ -n "$rows" ]; then
              echo "| section | metric | value | target | verdict | season | source | sensitive to |"
              echo "| --- | --- | ---: | :---: | --- | --- | --- | --- |"
              echo "$rows"
            else
              echo "No row with a target band was parsed — the harness's output shape has"
              echo "changed and the parser in this workflow needs updating. Full output"
              echo "below."
            fi
            echo
            if [ -n "$budget" ]; then
              echo "### Budget"
              echo
              echo "Reporting only, and measured on this runner: read the ratio rather than"
              echo "the milliseconds. The budget itself is ADR-0006's — a season in ~60 s."
              echo
              echo '```text'
              echo "$budget"
              echo '```'
              echo
            fi
            echo "<details><summary>Full harness output</summary>"
            echo
            echo '```text'
            cat harness-seed7.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
